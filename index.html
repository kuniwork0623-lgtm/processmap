<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e131b">
  <title>ProcessMap</title>
  <style>
    :root { --bg:#0e131b;--card-bg:#202c3a;--card-fg:#edf0f4;--sub-card-fg:#bfcbdc;--grand-card-fg:#bfcbdc;--canvas-fg:#a9b7c9;--node-muted:#8fa2be;--rail:#6d829f4c;--dots:#a5bbd50a;--txt:#edf0f4;--soft:#a9b7c9;--dim:#74839a;--line:#38485c;--accent:#86a9df;--stagew:296px;--gap:70px; }
    * { box-sizing:border-box; }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--txt); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Noto Sans JP",sans-serif; }
    button { font:inherit; cursor:pointer; }
    button:focus-visible,[contenteditable]:focus-visible { outline:2px solid #8baadd; outline-offset:3px; }
    #app { height:100dvh; display:flex; flex-direction:column; min-height:0; overflow:hidden; }
    .topbar { height:52px; flex:0 0 auto; padding:0 27px; display:flex; align-items:center; justify-content:space-between; background:var(--bg); border-bottom:1px solid #ffffff0b; z-index:10; }
    .brand {user-select:none;}
    .brand-name {font-weight:540;font-size:12px;letter-spacing:.12em;color:var(--canvas-fg);}
    .top-actions {display:flex; align-items:center; gap:9px}
    .quiet-button {color:var(--canvas-fg); width:35px; height:35px; border:none; border-radius:9px; background:transparent; display:grid;place-items:center; font-size:20px;}
    .quiet-button:hover,.quiet-button.active {background:#202a38;color:var(--txt)}
    .menu-wrap{position:relative}
    .menu {position:absolute;right:0;top:44px;width:min(300px,calc(100vw - 32px));max-height:calc(100dvh - 100px);overflow-y:auto;overscroll-behavior:contain;background:#1b2533;border:1px solid #334153;border-radius:12px;box-shadow:0 20px 60px #0009;padding:7px;z-index:8;}
    .menu[hidden], [hidden] {display:none!important}
    .menu button {display:block;width:100%;text-align:left;background:none;border:0;color:#dbe5f1;padding:11px 12px;border-radius:7px;font-size:13px}
    .menu button:hover{background:#ffffff0d}
    .menu hr {border:0;border-top:1px solid #ffffff14;margin:6px 4px}
    .palette-panel{position:absolute;right:0;top:44px;width:min(324px,calc(100vw - 28px));z-index:9;background:#1b2533;border:1px solid #344355;border-radius:14px;box-shadow:0 22px 70px #0009;padding:17px;color:#edf0f4;}
    .palette-section+.palette-section{margin-top:17px;padding-top:15px;border-top:1px solid #ffffff15;}
    .palette-heading{font-size:12px;font-weight:600;color:#d4e0ed;margin:0 0 10px;}
    .palette-swatches{display:flex;flex-wrap:wrap;align-items:center;gap:9px;}
    .palette-swatch{width:29px;height:29px;border-radius:9px;border:1px solid #ffffff35;cursor:pointer;padding:0;position:relative;outline-offset:3px;}
    .palette-swatch[aria-pressed="true"]::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;font-size:13px;font-weight:900;color:var(--swatch-check,#fff);}
    .palette-swatch:hover{outline:2px solid #9bc0f0;}
    .palette-custom{display:inline-flex;align-items:center;gap:5px;border:1px solid #536176;border-radius:8px;padding:3px 7px 3px 3px;font-size:11px;color:#c3cfdd;white-space:nowrap;}
    .palette-custom input{width:26px;height:25px;cursor:pointer;border:0;padding:0;background:none;}
    .palette-help{color:#8f9fb5;font-size:11px;line-height:1.5;margin-top:11px;}
    .canvas {flex:1;min-height:0;overflow:auto;cursor:grab;overscroll-behavior:contain;scrollbar-color:#3b485b transparent;scrollbar-width:thin;position:relative;background:var(--bg);background-image:radial-gradient(var(--dots) 0.75px, transparent 0.75px);background-size:24px 24px;}
    .canvas.panning{cursor:grabbing;user-select:none}
    .map {display:flex;gap:var(--gap);align-items:flex-start;width:max-content;min-width:100%;min-height:100%;padding:65px 100px 110px 75px;}
    .stage {width:max(var(--stagew),var(--stage-content-width, 0px));flex:0 0 max(var(--stagew),var(--stage-content-width, 0px));position:relative;min-height:110px;}
    .stage:not(:last-of-type)::after{content:"";position:absolute;top:47px;left:var(--heading-width,296px);width:calc(100% - var(--heading-width,296px) + var(--gap));height:1px;background:var(--rail);pointer-events:none;z-index:0}
    .stage-heading {position:relative;width:var(--heading-width,296px);min-width:210px;max-width:1200px;border-radius:15px;background:var(--card-bg);min-height:96px;padding:16px 40px 16px 48px;display:flex;align-items:center;transition:background .15s ease;cursor:grab;touch-action:pan-x pan-y}
    .stage-heading:hover{background:color-mix(in srgb,var(--card-bg) 94%,var(--card-fg) 6%)}
    .stage-heading.drag-source,.task-card.drag-source{opacity:.34}
    .stage-heading::before{content:attr(data-number);position:absolute;right:14px;top:5px;font-size:58px;font-weight:760;color:var(--card-fg);opacity:.055;line-height:1;pointer-events:none;user-select:none;}
    .stage-leading {position:absolute;left:16px;top:50%;transform:translateY(-50%);z-index:2;width:22px;height:28px;display:grid;place-items:center;}
    .stage-heading.is-done .stage-title{color:var(--node-muted);text-decoration:line-through;text-decoration-color:#6a839e66}
    .stage-heading.is-done .stage-leading .task-parent-toggle{color:var(--node-muted)}
    .stage-heading .task-checkbox{cursor:pointer}
    .stage-title {position:relative;color:var(--card-fg);font-weight:650;font-size:21px;line-height:1.4;letter-spacing:-.015em;min-height:28px;min-width:0;flex:1;white-space:pre-wrap;overflow-wrap:anywhere;word-break:normal;overflow:visible;text-overflow:clip;outline:none;cursor:text;max-width:none}
    .stage-title:focus{overflow:visible;text-overflow:clip}
    .task-link{color:inherit;text-decoration:underline;text-decoration-color:var(--accent);text-underline-offset:3px;cursor:pointer;overflow-wrap:anywhere}
    .editable:empty::before{content:attr(data-placeholder);color:#697b94;pointer-events:none}
    .stage-actions{position:absolute;right:7px;top:6px;opacity:0;pointer-events:none;display:flex;gap:3px;transition:opacity .16s}
    .stage:hover .stage-actions,.stage:focus-within .stage-actions,.stage.selected .stage-actions {opacity:1;pointer-events:auto}
    .node-action {color:#95a5b9;background:transparent;border:0;width:34px;height:34px;display:grid;place-items:center;border-radius:8px;font-size:15px;line-height:1;flex:0 0 34px;}
    .node-action:hover{color:#eff5fc;background:#ffffff0e}
    .node-action.danger:hover{color:#edb5ad}
    .stage-collapsed .task-list{display:none}
    .stage-collapsed .stage-heading{background:var(--card-bg)}
    .task-list{position:relative;padding:18px 0 0 0;margin:0}
    .task-list::before{display:none}
    .task-node {position:relative;margin-bottom:11px}
    .task-node::before{display:none}
    .task-card{min-height:53px;position:relative;display:flex;align-items:center;gap:9px;padding:12px 33px 12px 13px;border-radius:10px;background:var(--card-bg);touch-action:pan-x pan-y;cursor:grab;transition:background .15s;max-width:1200px;min-width:210px;}
    .task-card .task-text{white-space:pre-wrap;overflow-wrap:anywhere;overflow:visible;text-overflow:clip;word-break:normal;min-width:0;}
    .task-card .task-text:focus{overflow:visible;text-overflow:clip;}
    .task-card .task-text:focus::-webkit-scrollbar{display:none;}
    /* Width adjustment uses a slim side handle, never a bottom-right corner/L glyph. */
    /* Width handle lives just OUTSIDE the card; never overlaps the delete X. */
    .task-resize,.stage-resize{position:absolute!important;right:-24px;top:50%;transform:translateY(-50%);width:24px;height:36px;padding:0;border:0;background:transparent;opacity:0;cursor:ew-resize;touch-action:none;z-index:6!important;display:grid;place-items:center;transition:opacity .15s;}
    .task-resize::after,.stage-resize::after{content:"";width:3px;height:19px;background:radial-gradient(circle,#a1b2c8 1.15px,transparent 1.5px) center center / 3px 6px repeat-y;opacity:.85;}
    .task-card:hover .task-resize,.task-card:focus-within .task-resize,.task-node.selected>.task-card .task-resize,.stage-heading:hover .stage-resize,.stage-heading:focus-within .stage-resize,.stage.selected .stage-resize{opacity:.82;}
    .task-resize:hover,.stage-resize:hover{opacity:1!important;}

    .zoom-controls{position:fixed;right:20px;bottom:20px;z-index:6;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid #ffffff12;border-radius:12px;background:#1b2635ee;box-shadow:0 6px 20px #0003;padding:5px 4px;}
    .zoom-controls button{border:0;background:transparent;color:#cfdae8;width:39px;height:39px;border-radius:8px;font-size:20px;font-weight:350;display:grid;place-items:center;}
    .zoom-controls button:hover{background:#ffffff0e;}
    .zoom-controls button:disabled{opacity:.3;cursor:default;}
    .zoom-level{font-size:11px;font-weight:600;color:#b6c7db;font-variant-numeric:tabular-nums;height:29px;display:grid;place-items:center;min-width:39px;user-select:none;}
    .zoom-separator{height:1px;width:28px;background:#ffffff15;margin:3px 0}
    .zoom-controls #zoomReset{font-size:19px;color:#a4b9d4;height:36px;}
    .zoom-controls svg{width:19px;height:19px;pointer-events:none;}

    .task-card:hover,.task-node.selected>.task-card{background:color-mix(in srgb,var(--card-bg) 94%,var(--card-fg) 6%)}
    .task-card.is-done .task-text {color:var(--node-muted);text-decoration:line-through;text-decoration-color:#607085aa}
    /* 背景番号は工程カードだけ。タスクと子タスクには付けない。 */
    .task-card>* {position:relative;z-index:1}
    .task-text{font-weight:430;color:var(--card-fg);font-size:14px;line-height:1.48;word-break:break-word;white-space:pre-wrap;flex:1;min-height:21px;outline:none;cursor:text;}
    .task-checkbox{width:17px;height:17px;border-radius:5px;border:1.5px solid var(--node-muted);background:#0000;flex:0 0 17px;padding:0;display:grid;place-items:center;color:#111c27;font-size:13px;}
    .task-checkbox[aria-checked="true"]{background:#94b5e6;border-color:#94b5e6}
    .task-checkbox[aria-checked="true"]::after{content:"✓";font-size:12px;font-weight:800}
    .task-actions{position:absolute!important;right:3px;top:-1px;display:flex;gap:0;align-items:center;opacity:0;pointer-events:none;transition:opacity .14s;}
    .task-card:hover .task-actions,.task-card:focus-within .task-actions,.task-node.selected>.task-card .task-actions{opacity:1;pointer-events:auto}
    .task-actions .node-action{width:33px;height:34px;flex-basis:33px;font-size:13px}
    .task-actions .remove{font-size:16px;font-weight:300;color:var(--node-muted)}
    .task-actions .fold{font-size:11px}
    /* Branch line ends at the CENTER of the last grandchild, even for wrapped text. */
    .task-children{margin:4px 0 12px 17px;padding:1px 0 2px 13px;position:relative;border-left:0;}
    .task-children::before{content:"";position:absolute;left:0;top:0;width:1px;height:var(--branch-height,20px);background:var(--rail);pointer-events:none;display:block;}
    .task-children .task-node::before{content:"";display:block;position:absolute;left:-13px;top:19px;width:10px;height:1px;background:var(--rail);pointer-events:none;}
    .task-children .task-node{margin-bottom:2px}

    .task-children .task-card{min-height:40px;padding:7px 33px 7px 13px;background:color-mix(in srgb,var(--card-bg) 38%,var(--bg));border-radius:7px;}
    .task-children .task-card:hover,.task-children .task-node.selected>.task-card{background:color-mix(in srgb,var(--card-bg) 48%,var(--bg));}
    .task-children .task-text{font-size:13px;color:var(--grand-card-fg);font-weight:390}
    .task-children .task-card.is-done .task-text{color:var(--node-muted)}
    /* Grandchild (+) is a floating control on the LEFT of a child row. It never consumes vertical space. */
    .task-children-add{position:absolute;left:-32px;top:11px;z-index:4;width:26px;height:30px;display:grid;place-items:center;padding:0;margin:0;border:0;border-radius:7px;background:transparent;color:var(--canvas-fg);font-size:19px;font-weight:350;line-height:1;opacity:0;visibility:hidden;pointer-events:none;transition:opacity .12s ease,background .12s ease;}
    .task-node:hover>.task-children-add,.task-node.selected>.task-children-add,.task-node:focus-within>.task-children-add{opacity:1;visibility:visible;pointer-events:auto;}
    .task-children-add:hover,.task-children-add:focus-visible{background:color-mix(in srgb,var(--card-bg) 28%,transparent);color:var(--canvas-fg);}
    @media(hover:none){.task-node.selected>.task-children-add,.task-node:focus-within>.task-children-add{opacity:1;visibility:visible;pointer-events:auto;}}
    .add-task{display:flex;align-items:center;gap:8px;text-align:left}
    .add-task,.task-children-add{white-space:nowrap;}
    .draft-row{display:flex;align-items:center;margin:3px 0 8px 0;padding:2px 4px;min-height:36px;max-width:340px;border-bottom:1px solid #647e9c50;}
    .draft-row.grand-draft{margin-left:30px}
    .draft-input{width:100%;color:var(--canvas-fg);background:transparent;outline:0;border:0;padding:7px 4px;font-size:13px;line-height:1.5;font-family:inherit;resize:none;overflow:hidden;white-space:pre-wrap;min-height:33px;}
    .draft-input::placeholder{color:#7890ac}
    .task-parent-toggle{padding:0;border:0;background:transparent;color:var(--node-muted);width:17px;min-width:17px;height:20px;font-size:13px;line-height:1;display:grid;place-items:center;}
    .task-parent-toggle:hover{color:#e1ecfd}
    .task-node.collapsed>.task-children{display:none}
    .child-count{font-size:10px;color:var(--canvas-fg);opacity:.75;margin-left:3px}
    .add-task{margin:14px 0 0 0;color:var(--canvas-fg);background:transparent;border:0;border-radius:8px;min-height:35px;padding:3px 12px;font-size:12px;opacity:.48;transition:opacity .15s,background .15s}
    .stage:hover .add-task,.stage:focus-within .add-task,.add-task:hover,.add-task:focus-visible{opacity:1}
    .add-task:hover{background:#ffffff0b}
    .add-stage{width:53px;height:53px;margin-top:22px;align-self:flex-start;flex:0 0 53px;display:grid;place-items:center;color:#849ab8;font-size:25px;background:#192332;border:1px dashed #52627969;border-radius:14px;cursor:pointer}
    .add-stage:hover{color:#e7f0ff;background:#243146}
    .drag-over-before>.task-card::before,.drag-over-after>.task-card::after{content:"";position:absolute;height:2px;background:#a7c5f0;left:4px;right:4px;z-index:4;border-radius:5px}
    .drag-over-before>.task-card::before{top:-6px}
    .drag-over-after>.task-card::after{bottom:-6px}
    .drag-over-inside>.task-card{outline:1px solid #a7c5f0a0;background:#263850}
    .stage.drag-over-before>.stage-heading{outline:1px solid #789bcb}
    .drag-outline{position:fixed;z-index:20;pointer-events:none;opacity:.89;box-shadow:0 14px 42px #0007;max-width:300px;transform:rotate(-1deg);border-radius:10px;}
    .toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);padding:10px 13px;background:#253344;color:#e6ebf6;border:1px solid #ffffff1c;border-radius:10px;box-shadow:0 10px 25px #0005;display:flex;align-items:center;gap:15px;z-index:22;font-size:13px;white-space:nowrap}
    .toast button{border:0;background:none;color:#b7d3ff;font-weight:700}
    .modal-backdrop{position:fixed;inset:0;z-index:30;background:#090c12cc;display:grid;place-items:center;padding:18px;backdrop-filter:blur(4px)}
    .dialog{width:min(570px,100%);background:#1a2533;border:1px solid #ffffff14;border-radius:15px;padding:25px;box-shadow:0 30px 90px #000a;max-height:88dvh;overflow:auto}
    .dialog h2{font-size:18px;font-weight:650;margin:0 0 11px}
    .dialog p{color:#acbacb;font-size:13px;line-height:1.65;margin:0 0 15px}
    .dialog textarea{display:block;width:100%;min-height:155px;padding:13px;border:1px solid #425067;background:#101824;color:#e4edf5;font:12px/1.7 ui-monospace,SFMono-Regular,Consolas,monospace;resize:vertical;border-radius:9px}
    .dialog .error{font-size:12px;color:#ebb3aa;white-space:pre-wrap;margin-top:10px;line-height:1.5}
    .dialog .review{max-height:210px;overflow:auto;border-radius:9px;border:1px solid #ffffff14;margin-top:12px;padding:9px 14px;font-size:12px;color:#d5e1ef}
    .review-row{padding:7px 0;border-bottom:1px solid #ffffff11;line-height:1.5}
    .review-row:last-child{border:0}
    .dialog-footer{margin-top:16px;display:flex;gap:10px;justify-content:flex-end}
    .dialog-footer button{background:#273850;color:#e3efff;border:0;border-radius:8px;padding:9px 16px}
    .dialog-footer button.primary{background:#749dd7;color:#0b1728;font-weight:700}
    .dialog-footer button:disabled{opacity:.4;cursor:not-allowed}
    .hidden-input{display:none}
    @media(max-width:700px){
      :root{--stagew:269px;--gap:40px}
      .topbar{height:55px;padding:0 16px}
      .brand-name{font-size:12px}
      .map{padding:36px 62px 90px 26px}
      .stage:not(:last-of-type)::after{top:44px}
      .stage-heading{min-height:88px;padding:16px 40px 16px 46px}
      .stage-leading{left:14px}
      .stage-title{font-size:19px;max-width:none}
      .task-list{padding-left:0}
      .task-card{padding:11px 32px 11px 12px;min-height:52px}
      .task-actions{opacity:0}
      .task-children-add{opacity:0}
      .add-task{opacity:.75}
      .task-node.selected>.task-card .task-actions{opacity:1}
      .task-children{margin-left:15px;padding-left:12px}
      .task-children .task-node::before{left:-12px;width:9px}
      .node-action{width:42px;height:42px}
      .task-actions .node-action{width:39px;height:40px;flex-basis:39px}
      .task-resize,.stage-resize{width:27px;right:-27px;opacity:.42;}
      .dialog{padding:18px}
      .zoom-controls{right:11px;bottom:15px}
    }
    @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  
    #syncBar{font-size:12px}#syncBar button{min-height:44px}.account-details,.sync-details{padding:9px 12px;line-height:1.6;overflow-wrap:anywhere}.menu-label{display:block;color:var(--soft);font-size:11px;margin-bottom:3px}#accountInfo,#syncStatus{display:block;color:var(--txt)}dialog{color:#e5edf5;background:#202c3a;border:1px solid #607085;border-radius:12px;max-width:min(90vw,520px)}dialog input{display:block;margin:12px 0;width:100%;padding:10px;box-sizing:border-box}dialog button{min-height:40px;margin:4px}dialog::backdrop{background:#0009}.task-checkbox,.task-parent-toggle{position:relative}.task-checkbox::after,.task-parent-toggle::after{content:'';position:absolute;inset:-10px}.node-action{min-width:28px;min-height:28px}@media(pointer:coarse){.task-actions,.stage-actions,.task-resize,.stage-resize{opacity:1!important;pointer-events:auto}.topbar{height:auto;min-height:62px;flex-wrap:wrap}}
  .mobile-drag{display:none}@media(pointer:coarse){.mobile-drag{display:grid;place-items:center;position:absolute;right:2px;bottom:-7px;width:30px;height:30px;touch-action:none;user-select:none;color:#8f9fb5;z-index:5}}

    .sheet-bar{display:flex;align-items:center;gap:4px;flex:0 0 46px;min-width:0;padding:0 12px;border-top:1px solid #ffffff12;background:var(--bg);z-index:7}.sheet-tabs{display:flex;gap:3px;overflow-x:auto;min-width:0;flex:1;scrollbar-width:thin}.sheet-tab,.sheet-tool{border:0;background:transparent;color:var(--soft);min-height:40px;padding:8px 15px;border-radius:6px 6px 0 0;flex:0 0 auto}.sheet-tab{max-width:200px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;border-bottom:2px solid transparent}.sheet-tab[aria-selected="true"]{color:var(--txt);background:#ffffff08;border-bottom-color:var(--accent)}.sheet-tab:hover,.sheet-tool:hover{background:#ffffff0b}.sheet-tool{min-width:40px;padding:8px;font-size:20px}.zoom-controls{bottom:66px}.menu button:disabled{opacity:.4;cursor:default}#emphasisDialog,#sheetDialog{width:min(90vw,420px)}.settings-row{display:flex;align-items:center;gap:10px;margin:12px 0}.settings-row input{margin:0;min-width:0}.settings-row input[type=color]{width:54px;height:42px;padding:3px;flex:0 0 54px}.settings-row input[type=number]{width:100px}#emphasisTarget{overflow-wrap:anywhere;max-height:100px;overflow:auto}.settings-label{font-size:13px;color:var(--soft)}.settings-actions{display:flex;flex-wrap:wrap;gap:4px}#emphasisPreview{padding:20px;border-radius:10px;margin:20px 6px;background:var(--card-bg)}
</style>
</head>
<body>
<div id="app">
  <header class="topbar">
    <div class="brand"><span class="brand-name">ProcessMap</span></div>
    <div class="top-actions">
      <div class="menu-wrap">
        <button id="menuTrigger" class="quiet-button" aria-label="メニューを開く" title="メニュー" aria-expanded="false">···</button>
        <div class="menu" id="menu" hidden>
          <section id="syncBar" aria-label="アカウントと保存・同期">
            <div class="account-details"><span class="menu-label">アカウント</span><span id="accountInfo">未ログイン</span></div>
            <button id="loginOpen">ログイン</button>
            <button id="logout" hidden>ログアウト</button>
            <div class="sync-details"><span class="menu-label">保存・同期</span><span id="syncStatus" role="status" aria-live="polite">端末内に保存</span></div>
          </section>
          <hr>
          <button data-menu="prompt">AI用の現状をコピー</button>
          <button data-menu="ai">AI更新を取り込む</button>
          <button data-menu="palette">配色を変更</button>
          <button data-menu="emphasis" id="emphasisOpen" disabled title="先にカードをクリックして選択してください">選択したタスクの枠線…</button>
          <hr>
          <button data-menu="export">バックアップを書き出す</button>
          <button data-menu="import">バックアップを読み込む</button>
          <hr>
          <button data-menu="reset">サンプルに戻す</button>
        </div>

    let destination,where;
    if(target.kind==='list'){
      const s=findStage(target.id);if(!s)return false;
      destination=s.tasks;where=destination.length;
    }else if(target.kind==='task'){
      const dst=findTask(target.id);if(!dst)return false;
      if(dst.task.id===src.task.id)return false;
      if(target.mode==='inside'){
        if(src.task.children.length)return false;
        destination=dst.task.children;where=destination.length;
        dst.task.collapsed=false;dst.task.done=false;
      } else {
        destination=dst.list;where=dst.index+(target.mode==='after'?1:0);
        if(dst.depth===1&&src.task.children.length)return false;
      }
    }else return false;
    if(src.list===destination){if(src.index<where)where--;if(src.index===where)return false}
    src.list.splice(src.index,1);if(src.parent&&!src.parent.children.length)src.parent.done=false;destination.splice(where,0,src.task);
    const s=target.kind==='list'?findStage(target.id):findTask(target.id).stage;if(s)s.collapsed=false;
    return true;
  }
  function edgeScroll(x,y){
    const r=canvas.getBoundingClientRect();const zone=38,delta=17;
    if(x<r.left+zone)canvas.scrollLeft-=delta;
    if(x>r.right-zone)canvas.scrollLeft+=delta;
    if(y<r.top+zone)canvas.scrollTop-=delta;
    if(y>r.bottom-zone)canvas.scrollTop+=delta;
  }

      dragPending={...node,startX:e.clientX,startY:e.clientY,pointerId:e.pointerId,pointerType:e.pointerType};
      if(e.pointerType==='touch'){clearTimeout(dragTimer);dragTimer=setTimeout(()=>{if(dragPending)startDrag(dragPending)},380)}
    }else if(e.pointerType==='mouse'&&(e.target===canvas||e.target===map)){

    }
  });

    if(resizeSession)return;

      if(dragPending.pointerType==='mouse'&&Math.hypot(dx,dy)>6)startDrag(dragPending);

      ghost.style.left=(e.clientX-ghost.offsetWidth/2)+'px';ghost.style.top=(e.clientY-18)+'px';
      ghost.style.display='none';drag.drop=dragTarget(e.clientX,e.clientY);ghost.style.display='block';
      edgeScroll(e.clientX,e.clientY);
    }else if(pan&&e.buttons){canvas.scrollLeft=pan.sx+pan.x-e.clientX;canvas.scrollTop=pan.sy+pan.y-e.clientY}
  },{passive:false});

    clearTimeout(dragTimer);dragPending=null;

    }

  });
  document.addEventListener('pointercancel',()=>{if(resizeSession)return;clearTimeout(dragTimer);dragPending=null;if(drag){drag.elem.classList.remove('drag-source');ghost?.remove();ghost=null;drag=null;document.body.style.userSelect=''}pan=null;canvas.classList.remove('panning')});

  function exportJSON(){const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=el('a');a.href=url;a.download='tokoyo-cockpit-backup-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1500)}

  function currentSummary(){return state.stages.map((s,i)=>`${i+1}. [${s.id}] ${effectiveMainDone(s)?'✓':'□'} ${s.title}（メインタスク）\n${s.tasks.map((t,j)=>`  ${j+1}. [${t.id}] ${t.done?'✓':'□'} ${t.text||'(空欄)'}${t.children.map(c=>`\n     - [${c.id}] ${c.done?'✓':'□'} ${c.text||'(空欄)'}`).join('')}`).join('\n')}`).join('\n\n')}
  async function copyPrompt(){
    const txt=`あなたは常夜の工程マップ用の進捗更新を整理する役です。以下は最新状態です。相談・実装で確認できた変化だけを検出して、次のJSON形式のみ返してください。決定していないことや推測を完了として扱わないでください。新しいIDは自分で付けないでください。\n\n${currentSummary()}\n\nJSON形式: {"source_key":"固有の更新キー","updates":[{"action":"set_main_done","stageId":"メインタスクID","done":true},{"action":"set_done","taskId":"既存の子／孫ID","done":true},{"action":"add_task","stageId":"メインタスクID","text":"子タスク名"},{"action":"add_child","parentTaskId":"子タスクID","text":"孫タスク名"},{"action":"add_stage","title":"メインタスク名"}]}\n\n変更がなければupdatesを空配列に。必ず会話の文脈にある事実だけ。`;

  }
  function openAI(){$('modalTitle').textContent='AI更新を取り込む';$('modalDesc').textContent='ChatGPT・Claudeが作成した更新JSONを貼り付け、変更点を確認してから反映します。';$('aiText').readOnly=false;$('modal').hidden=false;$('aiError').hidden=true;$('aiReview').hidden=true;$('aiCommit').hidden=true;$('aiPreview').hidden=false;$('aiText').focus();pending=null}

  function digest(t){let h=2166136261;for(let i=0;i<t.length;i++){h^=t.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)}
  function applyActions(base,updates){
    const next=clone(base),details=[];
    const requireText=(v,label)=>{if(typeof v!=='string')throw Error(label+' が文字列ではありません');return cleanText(v)};
    for(let i=0;i<updates.length;i++){
      const u=updates[i],action=u?.action;
      if(!u||typeof u!=='object')throw Error('更新 '+(i+1)+' が不正です');
      const fail=()=>{throw Error('更新 '+(i+1)+' ('+action+') : 対象が見つかりません')};
      const f=()=>findTask(u.taskId,next);
      const s=()=>findStage(u.stageId,next);
      if(action==='add_stage'){
        const title=requireText(u.title,'title');next.stages.push({id:uid('s'),title,done:false,collapsed:false,tasks:[]});details.push('メインタスクを追加：'+title);
      }else if(action==='rename_stage'){
        const v=s();if(!v)fail();const t=requireText(u.title,'title');details.push('工程名：'+v.title+' → '+t);v.title=t;
      }else if(action==='add_task'){
        const v=s();if(!v)fail();const t=requireText(u.text,'text');if(!t.trim())throw Error('空の子タスクは新規登録できません');v.tasks.push(makeTask(t));v.done=false;details.push(v.title+' に子タスク追加：'+t);
      }else if(action==='add_child'){
        const v=findTask(u.parentTaskId,next);if(!v||v.depth!==0)fail();const t=requireText(u.text,'text');if(!t.trim())throw Error('空の孫タスクは新規登録できません');v.task.children.push(makeTask(t));v.task.done=false;v.task.collapsed=false;details.push('孫タスク追加：'+v.task.text+' → '+t);
      }else if(action==='update_task_text'){
        const v=f();if(!v)fail();const t=requireText(u.text,'text');details.push('タスク名：'+v.task.text+' → '+t);v.task.text=t;
      }else if(action==='set_main_done'){
        const v=s();if(!v)fail();if(typeof u.done!=='boolean')throw Error('done はtrue/falseで指定してください');if(activeChildren(v.tasks).length)throw Error('子タスクがあるメインタスクの完了は自動判定です');v.done=u.done;details.push((u.done?'メインタスク完了：':'メインタスク未完了：')+v.title);
      }else if(action==='set_done'){
        const v=f();if(!v)fail();if(typeof u.done!=='boolean')throw Error('done はtrue/falseで指定してください');if(activeChildren(v.task.children).length)throw Error('孫タスクがある子タスクの完了は自動判定です');v.task.done=u.done;details.push((u.done?'完了：':'未完了：')+v.task.text);
      }else if(action==='move_task'){
        const v=f(),to=findStage(u.toStageId,next);if(!v||!to)fail();v.list.splice(v.index,1);to.tasks.push(v.task);details.push('タスクを移動：'+v.task.text+' → '+to.title);
      }else throw Error('未対応の更新：'+action);
    }
    syncParents(next);return {next,details};
  }
